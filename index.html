function save(){try{localStorage.setItem("linkora.v1",JSON.stringify(data))}catch(e){toast("Could not save in this browser")}}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",2400)}
const catName=id=>(data.cats.find(c=>c.id===id)||{name:"Other"}).name;
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}};
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function logo(n,u){const ini=(n.match(/[A-Za-z0-9]/g)||["?"]).slice(0,2).join("").toUpperCase();const fallback=esc(ini);const icon="https://www.google.com/s2/favicons?domain="+encodeURIComponent(host(u||""))+"&sz=128";return `<div class="logoT" aria-hidden="true" style="background:hsl(${hue(n)} 70% 70%)"><img src="${esc(icon)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.textContent='${fallback}'"></div>`}
function card(s){return `<article class="card"><div class="top">${logo(s.name,s.url)}<div style="min-width:0"><h3>${esc(s.name)}</h3><div class="dom">${esc(host(s.url))}</div></div></div>
<p>${esc(s.desc)}</p>${s.flag?`<div class="warn bad">⚠ ${esc(s.flag)}</div>`:""}
<div class="chips"><span class="tag">${esc(catName(s.cat))}</span>${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
<a class="btn sm" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer nofollow">Visit site</a></article>`}
const active=()=>data.sites.filter(s=>s.status==="active");
let F={q:"",cat:"",sort:"new"};
function home(){const a=active(),feat=a.filter(s=>s.featured).slice(0,3),rec=[...a].sort((x,y)=>y.added.localeCompare(x.added)).slice(0,6);
return `<section class="hero"><h1>The internet, organized.</h1><p>Linkora collects useful online tools in one place, sorted by category and searchable in a keystroke.</p>
<div class="mt"><input id="hq" type="search" placeholder="Search tools, tags, categories" aria-label="Search tools" autocomplete="off"></div>
<div class="row mt"><a class="btn p" href="#/categories">Explore categories</a><a class="btn" href="#/explore">Browse all tools</a></div></section>
<section class="sec"><h2>Featured tools</h2>${feat.length?`<div class="grid">${feat.map(card).join("")}</div>`:`<div class="empty">Nothing featured yet. Star a tool from Manage.</div>`}</section>
<section class="sec"><h2>Categories</h2><div class="grid">${catCards()}</div></section>
<section class="sec"><h2>Recently added</h2><div class="grid">${rec.map(card).join("")}</div></section>
<section class="sec lab"><h2>Automation Lab</h2><p class="mu">Paste a tutorial or transcript. Linkora pulls out the steps and scaffolds a Python project with a dry-run mode, config and tests.</p><a class="btn p" href="#/lab">Open the lab</a></section>`}
function catCards(){return data.cats.map(c=>{const n=active().filter(s=>s.cat===c.id).length;return `<button class="card cat" data-act="cat" data-id="${esc(c.id)}"><b>${esc(c.icon)}</b><h3>${esc(c.name)}</h3><span class="mu">${n} tool${n===1?"":"s"}</span></button>`}).join("")}
function filtered(){const q=F.q.trim().toLowerCase();let r=active().filter(s=>(!F.cat||s.cat===F.cat)&&(!q||[s.name,s.desc,catName(s.cat),(s.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)));
 r.sort(F.sort==="az"?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.added.localeCompare(a.added));return r}
function explore(){return `<h1>Explore</h1><div class="row mt"><input id="eq" type="search" style="flex:2;min-width:200px" placeholder="Search by name, description or tag" aria-label="Search" value="${esc(F.q)}">
<select id="es" style="flex:1;min-width:150px" aria-label="Sort"><option value="new"${F.sort==="new"?" selected":""}>Recently added</option><option value="az"${F.sort==="az"?" selected":""}>A to Z</option></select></div>
<div class="chips mt"><button class="chip${F.cat?"":" on"}" data-act="cat" data-id="">All</button>${data.cats.map(c=>`<button class="chip${F.cat===c.id?" on":""}" data-act="cat" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join("")}</div>
<div class="row mt"><span class="mu" id="cnt"></span><button class="btn sm" data-act="clear">Clear filters</button></div><div class="grid mt" id="res"></div>`}
function results(){const r=filtered();$("#cnt").textContent=`${r.length} result${r.length===1?"":"s"}`;$("#res").innerHTML=r.length?r.map(card).join(""):`<div class="empty" style="grid-column:1/-1">No tools match. Try another word or clear the filters.</div>`}
function categories(){return `<h1>Categories</h1><div class="grid mt">${catCards()}</div>`}
function about(){return `<h1>About Linkora</h1><p class="mu" style="max-width:640px">Linkora is a curated directory of online tools. Entries are added only after you approve them. Services involving public SMS inboxes, phone numbers or bulk messaging carry a visible caution, and nothing here is an endorsement.</p>
<p class="mu" style="max-width:640px">This version runs entirely in your browser. Your changes are stored in this browser only, so they are not shared and can be lost if you clear site data. Export JSON from Manage to back them up. New sites must resolve to a public DNS address before approval or JSON import; DNS resolution does not guarantee that a site is trustworthy or that every page is available.</p>`}
/* manage */
let P=[];
function manage(){const all=data.sites;return `<h1>Manage</h1><div class="warn mt">This page has no login. It edits only your own browser's copy. Shared, protected admin needs a backend with real authentication, which is not configured.</div>
<section class="sec"><h2>Add from transcript</h2><p class="mu" style="max-width:720px;font-size:13px">Linkora checks each domain for public DNS A/AAAA records before allowing approval. Non-resolving domains, shortened links and unchecked domains are blocked. DNS existence does not guarantee that a website is trustworthy or that its pages are currently working.</p><textarea id="tx" placeholder="Paste a transcript or text containing website names and links"></textarea><div class="row mt"><button class="btn p" data-act="extract">Extract websites</button><span class="mu" id="xmsg"></span></div><div id="prev"></div></section>
<section class="sec"><h2>Directory (${all.length})</h2><div class="row"><button class="btn sm" data-act="export">Export JSON</button><label class="btn sm">Import JSON<input id="imp" type="file" accept="application/json" hidden></label></div>
<div class="tbl mt">${all.map(s=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>${esc(s.name)}</b><span class="mu dom">${esc(s.url)}</span><span class="tag">${esc(s.status)}</span></div><div class="row"><button class="btn sm" data-act="feat" data-id="${s.id}">${s.featured?"Unfeature":"Feature"}</button><button class="btn sm" data-act="arch" data-id="${s.id}">${s.status==="active"?"Archive":"Restore"}</button><button class="btn sm d" data-act="del" data-id="${s.id}">Delete</button></div></div>`).join("")}</div></section>
<section class="sec"><h2>Add a category</h2><div class="row"><input id="nc" style="flex:1;min-width:180px" placeholder="Category name" aria-label="Category name"><button class="btn" data-act="addcat">Add category</button></div></section>`}
const norm=u=>{try{u=u.trim().replace(/[)\].,;:!?'"]+$/,"");if(!/^https?:\/\//i.test(u))u="https://"+u;const x=new URL(u);if(!/\.[a-z]{2,}$/i.test(x.hostname))return null;x.hash="";return x.origin+(x.pathname==="/"?"":x.pathname.replace(/\/$/,""))+x.search}catch(e){return null}};

// Fail closed: new domains must resolve to a public web address before approval/import.
async function verifyDomain(url){
 try{
  const parsed=new URL(url),h=parsed.hostname.toLowerCase();
  if(!h||h==="localhost"||h.endsWith(".localhost")||h.endsWith(".local")||h.endsWith(".test")||h.endsWith(".invalid")||h.endsWith(".example")||h.includes(":"))return {ok:false,reason:"Not a public website domain"};
  const answers=await Promise.all(["A","AAAA"].map(async type=>{
   const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),6500);
   try{
    const res=await fetch("https://dns.google/resolve?name="+encodeURIComponent(h)+"&type="+type,{headers:{accept:"application/dns-json"},cache:"no-store",signal:ctrl.signal});
    if(!res.ok)return false;
    const json=await res.json();
    return json.Status===0&&Array.isArray(json.Answer)&&json.Answer.some(a=>Number(a.type)===1||Number(a.type)===28);
   }catch(e){return false}finally{clearTimeout(timer)}
  }));
  return answers.some(Boolean)?{ok:true,reason:"Public DNS address found"}:{ok:false,reason:"No public A/AAAA address found"};
 }catch(e){return {ok:false,reason:"DNS lookup failed or could not be reached"}}
}
const SUS=/bomb|spam|otp|hack|crack|stresser|ddos|keylog|phish|bypass|sms.?flood/i,SHORT=/^(bit\.ly|t\.co|tinyurl\.com|goo\.gl|is\.gd)$/;
function guess(t){const m=[["ai",/\b(ai|gpt|llm|chat)\b/],["dev",/(github|code|dev|api|git)/],["design",/(design|image|photo|figma|canva)/],["conv",/(convert|pdf|compress)/],["cloud",/(drive|cloud|storage)/],["sec",/(vpn|privacy|secure|lookup)/],["edu",/(learn|course|edu)/],["social",/(instagram|tiktok|youtube|twitter)/],["comm",/(sms|mail|call|chat|message)/],["ent",/(movie|music|game|video)/]];for(const [c,r] of m)if(r.test(t))return c;return "other"}
async function extract(){const t=$("#tx").value,seen=new Set(),out=[];
 (t.match(/(?:https?:\/\/)?(?:[a-z0-9-]+\.)+[a-z]{2,}(?:\/[^\s<>"']*)?/gi)||[]).forEach(raw=>{if(/^[\w.+-]+@/.test(raw)||/\.(png|jpg|jpeg|gif|js|css|py|txt|md)$/i.test(raw))return;const u=norm(raw);if(!u)return;const h=host(u),key=h.toLowerCase();if(seen.has(key))return;seen.add(key);
 const dup=data.sites.find(s=>host(s.url)===h),fl=[];if(SUS.test(t.slice(Math.max(0,t.indexOf(raw)-80),t.indexOf(raw)+80))||SUS.test(h))fl.push("Context or name suggests abusive use");if(SHORT.test(h))fl.push("Link shortener hides the real destination");if(/xn--/.test(h))fl.push("Punycode domain, check for lookalikes");
 const nm=h.split(".")[0];out.push({name:nm.charAt(0).toUpperCase()+nm.slice(1),url:u,cat:guess(h),desc:"",tags:[],dup:dup?dup.id:"",flags:fl,state:"pending",verifying:true,verified:false,verifyMessage:"Checking public DNS…"})});
 P=out;$("#xmsg").textContent=out.length?(out.length+" unique domain"+(out.length===1?"":"s")+" found; verifying before approval…"):"No valid website addresses found. Check the pasted text.";prev();
 const limited=out.slice(0,30);if(out.length>30)$("#xmsg").textContent="First 30 unique domains will be checked to avoid overload.";
 await Promise.all(limited.map(async p=>{const result=SHORT.test(host(p.url))?{ok:false,reason:"Link shortener cannot be verified to the final destination"}:await verifyDomain(p.url);p.verified=result.ok;p.verifying=false;p.verifyMessage=result.reason;}));
 out.slice(30).forEach(p=>{p.verifying=false;p.verified=false;p.verifyMessage="Not checked: only 30 domains are checked per paste";});
 if($("#prev"))prev();
 const verified=out.filter(p=>p.verified).length;
 if($("#xmsg"))$("#xmsg").textContent=verified+" verified; "+(out.length-verified)+" unverified/rejected. Only DNS-verified domains can be approved.";
}
function prev(){if(!$("#prev"))return;$("#prev").innerHTML=P.map((p,i)=>{
 if(p.state==="rejected")return "";
 const verify=p.verifying?'<div class="warn">◌ Checking public DNS records…</div>':p.verified?'<div class="tag" style="display:inline-block;color:#c7ff4d">✓ Domain verified: '+esc(p.verifyMessage||"Public DNS address found")+'</div>':'<div class="warn bad">✕ Not verified: '+esc(p.verifyMessage||"domain could not be verified")+'. This site cannot be added.</div>';
 const cats=data.cats.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===p.cat?' selected':'')+'>'+esc(c.name)+'</option>').join("");
 const enabled=p.verified&&!p.verifying;
 return '<div class="card mt" data-i="'+i+'"><b>'+esc(p.url)+'</b>'+(p.dup?'<div class="warn">Already in the directory. Approving updates the existing entry.</div>':'')+verify+p.flags.map(f=>'<div class="warn bad">⚠ '+esc(f)+'. Manual review needed.</div>').join("")+
 '<div class="rev"><input data-f="name" value="'+esc(p.name)+'" aria-label="Name"><input data-f="desc" value="'+esc(p.desc)+'" placeholder="Description (write it yourself, none is invented)" aria-label="Description"><select data-f="cat" aria-label="Category">'+cats+'</select></div>'+
 '<div class="row"><button class="btn p sm" data-act="ok" data-i="'+i+'" '+(enabled?'':'disabled title="Verify the domain first"')+'>'+(p.dup?"Update entry":"Approve")+'</button><button class="btn sm" data-act="no" data-i="'+i+'">Reject</button></div></div>';
}).join("")}
function approve(i){const p=P[i];if(!p||p.verified!==true||p.verifying){toast("This domain is not verified. It cannot be added.");return}if(!p.name.trim()||!p.desc.trim()){toast("Add a name and a description first");return}
 const flag=p.flags.join(". ");if(p.dup){const s=data.sites.find(x=>x.id===p.dup);if(!s){toast("Existing entry was not found");return}Object.assign(s,{name:p.name,desc:p.desc,cat:p.cat});if(flag)s.flag=flag}
 else data.sites.push({id:"u"+Date.now()+i,name:p.name.trim(),url:p.url,cat:p.cat,desc:p.desc.trim(),tags:[],added:new Date().toISOString().slice(0,10),featured:false,status:"active",flag});
 p.state="rejected";save();toast("Saved — domain had a public DNS address");render()}
/* lab */
const HARM=/(otp|one.?time.?pass|sms.?bomb|call.?bomb|bulk (sms|call)|spam|flood|ddos|credential|steal|keylog|bypass (login|captcha|2fa)|scrape passwords|unauthori[sz]ed)/i;
let LAB=null;
function lab(){return `<h1>Automation Lab</h1><p class="mu" style="max-width:640px">Paste a tutorial or process description. Linkora extracts the steps and generates a Python project scaffold. It does not run any code, so nothing is tested or deployed here.</p>
<textarea id="lt" class="mt" placeholder="1. Read a CSV of invoices&#10;2. Total the amounts per client&#10;3. Save a summary to report.csv"></textarea><div class="row mt"><button class="btn p" data-act="gen">Generate project</button></div><div id="labout"></div>`}
function gen(){const t=$("#lt").value.trim();if(!t){$("#labout").innerHTML=`<div class="warn bad mt">Paste some instructions first.</div>`;return}
 let lines=t.split(/\n+/).map(l=>l.replace(/^\s*(\d+[.)]|[-*•])\s*/,"").trim()).filter(l=>l.length>3);if(lines.length<2)lines=t.split(/(?<=[.!?])\s+/).filter(l=>l.length>3);
 const bad=lines.filter(l=>HARM.test(l)),ok=lines.filter(l=>!HARM.test(l));
 let h="";if(bad.length)h+=`<div class="warn bad mt"><b>${bad.length} step${bad.length>1?"s":""} not automated.</b> They involve harassment, spam, credential or OTP abuse, or security bypass, which Linkora will not generate:<ul>${bad.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>Safe alternative: use the official API or consent-based flow of the service involved.</div>`;
 if(!ok.length){$("#labout").innerHTML=h+`<div class="empty mt">No steps left to build.</div>`;return}
 const fn=ok.map((s,i)=>`def step_${i+1}(ctx, dry_run):\n    """${s.replace(/"""/g,"'''").slice(0,90)}"""\n    log.info("Step ${i+1}: %s", step_${i+1}.__doc__)\n    if dry_run:\n        log.info("[dry-run] would perform step ${i+1}")\n        return ctx\n    raise NotImplementedError("Implement step ${i+1}")\n`).join("\n");
 const files={"main.py":`"""Generated scaffold. Steps are stubs you must implement."""\nimport argparse, logging, os\n\nlog = logging.getLogger("project")\n\n${fn}\nSTEPS = [${ok.map((_,i)=>"step_"+(i+1)).join(", ")}]\n\n\ndef run(dry_run=True):\n    ctx = {"input": os.getenv("INPUT_PATH", "input.csv")}\n    for step in STEPS:\n        ctx = step(ctx, dry_run)\n    return ctx\n\n\nif __name__ == "__main__":\n    ap = argparse.ArgumentParser()\n    ap.add_argument("--execute", action="store_true", help="disable dry-run")\n    logging.basicConfig(level=logging.INFO)\n    run(dry_run=not ap.parse_args().execute)\n`,
 "test_main.py":`import main\n\n\ndef test_dry_run_completes():\n    assert main.run(dry_run=True) is not None\n`,"requirements.txt":"pytest>=8.0\n",".env.example":"INPUT_PATH=input.csv\n# Add API keys here. Never commit a real .env file.\n",
 "README.md":`# Project scaffold\n\nPython 3.10+. Generated from ${ok.length} step(s):\n\n${ok.map((s,i)=>`${i+1}. ${s}`).join("\n")}\n\n## Use\n\n    pip install -r requirements.txt\n    python main.py            # dry run\n    python main.py --execute  # real run (after implementing steps)\n    pytest\n\nStatus: generated only. Not executed or tested by Linkora.\n`};
 LAB=files;const names=Object.keys(files);
 $("#labout").innerHTML=h+`<section class="sec"><h2>Plan</h2><ol>${ok.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><p class="mu">Inputs: INPUT_PATH (edit in .env). Add credentials and external services yourself where a step needs them.</p></section>
 <h2>Files</h2><div class="tabs">${names.map((n,i)=>`<button class="chip${i?"":" on"}" data-act="file" data-n="${n}">${n}</button>`).join("")}</div><pre id="fv"></pre><div class="row"><button class="btn sm" data-act="copy">Copy file</button></div>`;showFile(names[0])}
let CUR="";function showFile(n){CUR=n;$("#fv").textContent=LAB[n];document.querySelectorAll("[data-act=file]").forEach(b=>b.classList.toggle("on",b.dataset.n===n))}
/* router */
function render(){const r=(location.hash.replace(/^#\/?/,"")||"home").split("/")[0];const v={home,explore,categories,lab,manage,about}[r]||home;app.innerHTML=v();
 document.querySelectorAll("[data-n]").forEach(a=>a.classList.toggle("on",a.dataset.n===(r==="home"?"home":r)));if(r==="explore")results();window.scrollTo(0,0)}
document.addEventListener("input",e=>{const t=e.target;if(t.id==="hq"){F.q=t.value;if(t.value){location.hash="#/explore";setTimeout(()=>{const x=$("#eq");if(x){x.focus();x.setSelectionRange(99,99)}},0)}}
 else if(t.id==="eq"){F.q=t.value;results()}else if(t.id==="es"){F.sort=t.value;results()}
 else if(t.dataset.f){const i=+t.closest("[data-i]").dataset.i;P[i][t.dataset.f]=t.value}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.f){const i=+t.closest("[data-i]").dataset.i;P[i][t.dataset.f]=t.value}
 if(t.id==="imp"&&t.files[0]){const f=new FileReader();f.onload=async()=>{try{const d=JSON.parse(f.result);if(!Array.isArray(d.sites)||!Array.isArray(d.cats))throw 0;
 const have=new Set(data.sites.map(s=>host(s.url))),raw=[];let skipped=0;
 d.sites.forEach(s=>{const u=s&&s.name?norm(String(s.url||"")):null;if(!u){skipped++;return}const h=host(u);if(have.has(h)){skipped++;return}have.add(h);raw.push({s,url:u})});
 const checked=await Promise.all(raw.slice(0,30).map(async x=>({s:x.s,url:x.url,check:await verifyDomain(x.url)})));skipped+=raw.length-checked.length;let n=0;
 checked.forEach(x=>{if(!x.check.ok){skipped++;return}const s=x.s;data.sites.push({id:"i"+Date.now()+n,name:String(s.name),url:x.url,cat:s.cat||"other",desc:String(s.desc||""),tags:Array.isArray(s.tags)?s.tags.map(String):[],added:s.added||new Date().toISOString().slice(0,10),featured:!!s.featured,status:s.status==="archived"?"archived":"active",flag:s.flag||""});n++});
 d.cats.forEach(c=>{if(c.id&&c.name&&!data.cats.some(x=>x.id===c.id))data.cats.push({id:String(c.id),name:String(c.name),icon:String(c.icon||"•")})});
 save();toast("Imported "+n+"; skipped "+skipped+" duplicate, unverified or unchecked site(s).");render()}catch(x){toast("Import failed: invalid Linkora JSON. No unchecked site was added.")}};f.readAsText(t.files[0])}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,s=data.sites.find(x=>x.id===id);
 if(a==="cat"){F.cat=id;F.q="";location.hash="#/explore";if(location.hash==="#/explore")render()}
 else if(a==="clear"){F={q:"",cat:"",sort:"new"};render()}
 else if(a==="extract")extract();else if(a==="ok")approve(+b.dataset.i);else if(a==="no"){P[+b.dataset.i].state="rejected";prev()}
 else if(a==="feat"){s.featured=!s.featured;save();render()}else if(a==="arch"){s.status=s.status==="active"?"archived":"active";save();render()}
 else if(a==="del"){if(confirm("Delete "+s.name+"? This cannot be undone.")){data.sites=data.sites.filter(x=>x.id!==id);save();render()}}
 else if(a==="addcat"){const n=$("#nc").value.trim();if(!n){toast("Enter a category name");return}const cid=n.toLowerCase().replace(/[^a-z0-9]+/g,"-");if(data.cats.some(c=>c.id===cid)){toast("That category already exists");return}data.cats.push({id:cid,name:n,icon:n[0].toUpperCase()});save();render()}
 else if(a==="export"){const t=JSON.stringify(data,null,2);navigator.clipboard.writeText(t).then(()=>toast("JSON copied to clipboard"),()=>{$("#prev").innerHTML=`<textarea class="mt" readonly>${esc(t)}</textarea>`;toast("Copy the JSON below")})}
 else if(a==="gen")gen();else if(a==="file")showFile(b.dataset.n);else if(a==="copy")navigator.clipboard.writeText(LAB[CUR]).then(()=>toast("Copied"),()=>toast("Select the text and copy manually"))});
window.addEventListener("hashchange",render);load();render();
</script></body></html>
